<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simplified Video Test</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }
    
    .container {
      max-width: 1000px;
      margin: 20px auto;
      padding: 20px;
    }
    
    h1 {
      text-align: center;
      margin-bottom: 20px;
    }
    
    .video-carousel {
      position: relative;
      width: 100%;
      height: 500px;
      background: #000;
      overflow: hidden;
    }
    
    .video-carousel video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    
    .controls {
      margin-top: 20px;
      text-align: center;
    }
    
    button {
      padding: 10px 20px;
      margin: 0 5px;
      cursor: pointer;
      background: #0056b3;
      color: white;
      border: none;
      border-radius: 4px;
    }
    
    .log {
      margin-top: 20px;
      padding: 10px;
      background: #f5f5f5;
      border: 1px solid #ddd;
      height: 150px;
      overflow-y: auto;
      font-family: monospace;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Simplified Video Carousel Test</h1>
    
    <div class="video-carousel" id="video-carousel">
      <!-- Videos are loaded via JavaScript -->
    </div>
    
    <div class="controls">
      <button id="btn-1">Show Video 1</button>
      <button id="btn-2">Show Video 2</button>
      <button id="btn-3">Show Video 3</button>
      <button id="btn-auto">Auto Play</button>
      <button id="btn-stop">Stop</button>
    </div>
    
    <div class="log" id="log"></div>
  </div>
  
  <script>
    // Simple logger
    function log(message) {
      const logElement = document.getElementById('log');
      const timestamp = new Date().toLocaleTimeString();
      logElement.innerHTML += `<div>[${timestamp}] ${message}</div>`;
      logElement.scrollTop = logElement.scrollHeight;
      console.log(message);
    }
    
    // Wait for DOM to be fully loaded
    document.addEventListener('DOMContentLoaded', function() {
      log('Page loaded, initializing video carousel');
      
      const carousel = document.getElementById('video-carousel');
      const videoFiles = [
        './assets/videos/video1.mp4',
        './assets/videos/video2.mp4',
        './assets/videos/video3.mp4'
      ];
      
      const videos = [];
      let currentVideo = 0;
      let autoplayInterval = null;
      
      // Create video elements
      videoFiles.forEach((src, index) => {
        const video = document.createElement('video');
        video.muted = true;
        video.loop = true;
        video.playsInline = true;
        video.preload = 'auto';
        video.style.display = index === 0 ? 'block' : 'none';
        
        const source = document.createElement('source');
        source.src = src;
        source.type = 'video/mp4';
        
        video.appendChild(source);
        carousel.appendChild(video);
        videos.push(video);
        
        // Log video events
        video.addEventListener('loadstart', () => log(`Video ${index+1}: Load started`));
        video.addEventListener('loadeddata', () => log(`Video ${index+1}: Data loaded`));
        video.addEventListener('canplay', () => log(`Video ${index+1}: Can play`));
        video.addEventListener('play', () => log(`Video ${index+1}: Playing`));
        video.addEventListener('pause', () => log(`Video ${index+1}: Paused`));
        video.addEventListener('error', (e) => log(`Video ${index+1}: Error - ${e.message || 'Unknown error'}`));
      });
      
      // Function to show a specific video
      function showVideo(index) {
        log(`Switching to video ${index+1}`);
        
        // Hide all videos and pause them
        videos.forEach((video, i) => {
          if (i !== index) {
            video.style.display = 'none';
            video.pause();
          }
        });
        
        // Show and play the selected video
        const video = videos[index];
        video.style.display = 'block';
        
        video.play().catch(error => {
          log(`Error playing video ${index+1}: ${error.message}`);
          
          // Try again with muted option explicitly set
          if (error.name === 'NotAllowedError') {
            log(`Trying again with muted option for video ${index+1}`);
            video.muted = true;
            video.play().catch(e => {
              log(`Still cannot play video ${index+1}: ${e.message}`);
            });
          }
        });
        
        currentVideo = index;
      }
      
      // Start autoplay
      function startAutoplay() {
        if (autoplayInterval) {
          clearInterval(autoplayInterval);
        }
        
        log('Starting autoplay');
        autoplayInterval = setInterval(() => {
          currentVideo = (currentVideo + 1) % videos.length;
          showVideo(currentVideo);
        }, 5000);
      }
      
      // Stop autoplay
      function stopAutoplay() {
        if (autoplayInterval) {
          log('Stopping autoplay');
          clearInterval(autoplayInterval);
          autoplayInterval = null;
        }
      }
      
      // Set up button events
      document.getElementById('btn-1').addEventListener('click', () => {
        stopAutoplay();
        showVideo(0);
      });
      
      document.getElementById('btn-2').addEventListener('click', () => {
        stopAutoplay();
        showVideo(1);
      });
      
      document.getElementById('btn-3').addEventListener('click', () => {
        stopAutoplay();
        showVideo(2);
      });
      
      document.getElementById('btn-auto').addEventListener('click', startAutoplay);
      document.getElementById('btn-stop').addEventListener('click', stopAutoplay);
      
      // Start with the first video
      log('Starting with video 1');
      showVideo(0);
      
      // Force a click on document to bypass autoplay restrictions
      log('Adding user interaction simulation');
      document.addEventListener('click', function initialClick() {
        log('User interaction detected, trying to play videos');
        videos[currentVideo].play().catch(e => log(`Still cannot play after interaction: ${e.message}`));
        document.removeEventListener('click', initialClick);
      });
    });
  </script>
</body>
</html>
